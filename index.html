<!DOCTYPE html>
<html lang="en" ng-app="SmartLibApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLib Dashboard</title>
    <link rel="stylesheet" href="css/styling.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>
<body ng-controller="DashboardController">
    <div class="app-container">
        <header class="top-nav">
            <div style="font-weight:700;"><i class="fa-solid fa-book-bookmark" style="color:var(--primary);"></i> SmartLib</div>
            <div><span style="background:#dbeafe; color:var(--primary); font-size:11px; padding:2px 8px; border-radius:12px; font-weight:700;">ADM</span></div>
        </header>
        <main style="padding: 16px;">
            <div class="card">
                <h1 style="font-size: 18px; font-weight: 700;">Welcome back, {{librarianName}}</h1>
                <p style="font-size: 12px; color: #475569;">Daily circulation telemetry & desk operations.</p>
            </div>
            <div class="card" style="background:#fef2f2; border-color:#fca5a5;">
                <div style="font-weight:700; color:#991b1b; font-size:13px; margin-bottom:6px;"><i class="fa-solid fa-triangle-exclamation"></i> Overdue Escalations: 18</div>
                <button class="btn-primary" ng-click="broadcastReminders()" style="background:#dc2626;">Broadcast Reminders</button>
            </div>
            <div class="card">
                <h3 style="font-size:14px; font-weight:700; margin-bottom:10px;">Return Queue</h3>
                <div ng-repeat="item in returnQueue" style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #d2d9f4;">
                    <div>
                        <div style="font-weight:700; font-size:12px;">{{item.title}}</div>
                        <div style="font-size:10px; color:#475569;">{{item.author}}</div>
                    </div>
                    <button class="btn-primary" ng-click="processReturn(item)" style="width:auto; padding:4px 10px; font-size:11px;">Return</button>
                </div>
            </div>
        </main>
        <nav class="bottom-tab-bar">
            <button class="tab-item active"><i class="fa-solid fa-chart-pie"></i>Dashboard</button>
            <button class="tab-item"><i class="fa-solid fa-book"></i>Catalog</button>
            <button class="tab-item"><i class="fa-solid fa-right-left"></i>Circulation</button>
            <button class="tab-item"><i class="fa-solid fa-user"></i>Profile</button>
        </nav>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
